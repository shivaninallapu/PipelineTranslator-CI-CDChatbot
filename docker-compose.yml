services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      FRONTEND_URL: http://localhost:5173
      LOCALAI_URL: http://host.docker.internal:8080
      OLLAMA_URL: http://host.docker.internal:11434
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

